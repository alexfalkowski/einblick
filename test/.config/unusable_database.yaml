environment: development
duckdb:
  path: .config
  memory_limit: 64MiB
  threads: 1
health:
  duration: 1s
  timeout: 1s
id:
  kind: uuid
telemetry:
  logger:
    kind: text
    level: debug
  metrics:
    kind: prometheus
  tracer:
    kind: otlp
    url: http://localhost:4318/v1/traces
transport:
  http:
    address: tcp://:0
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
  grpc:
    address: tcp://:0
    max_receive_size: 1MB
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
