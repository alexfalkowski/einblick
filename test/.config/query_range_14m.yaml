environment: development
queries:
  max_results: 100
  max_range: 14m
  timeout: 30s
duckdb:
  path: reports/recent.duckdb
  memory_limit: 64MiB
  threads: 1
health:
  duration: 1s
  timeout: 1s
id:
  kind: uuid
telemetry:
  logger:
    kind: text
    level: debug
  metrics:
    kind: prometheus
  tracer:
    kind: otlp
    endpoint: http://localhost:4318/v1/traces
transport:
  http:
    address: tcp://:11000
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
  grpc:
    address: tcp://:12000
    max_receive_size: 1MB
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
