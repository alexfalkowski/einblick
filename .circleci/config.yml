version: 2.1

commands:
  sync-submodules:
    steps:
      - run: git submodule sync
      - run: git submodule update --init
  checkout-submodules:
    steps:
      - checkout:
          method: blobless
      - sync-submodules
  prepare-service:
    steps:
      - checkout-submodules
      - run: make source-key
      - restore_cache:
          name: restore go cache
          keys:
            - einblick-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
            - einblick-go-cache-
      - restore_cache:
          name: restore ruby cache
          keys:
            - einblick-ruby-cache-{{ checksum "test/Gemfile.lock" }}-{{ checksum "~/.ruby-version" }}
            - einblick-ruby-cache-
      - run: make clean
      - run: make dep
      - restore_cache:
          name: restore go build cache
          keys:
            - einblick-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
            - einblick-go-build-cache-

executors:
  go:
    docker:
      - image: &go_image alexfalkowski/go:5.26
  go-archive:
    docker:
      - image: *go_image
      - image: floci/floci:2.5.0
        environment:
          FLOCI_AUTH_VALIDATE_SIGNATURES: "true"
  release:
    docker:
      - image: alexfalkowski/release:8.54
  alpine:
    docker:
      - image: alpine:latest

jobs:
  build-service:
    executor: go
    working_directory: ~/einblick
    steps:
      - prepare-service
      - save_cache:
          name: save go cache
          key: einblick-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
          paths:
            - ~/go/pkg/mod
      - save_cache:
          name: save ruby cache
          key: einblick-ruby-cache-{{ checksum "test/Gemfile.lock" }}-{{ checksum "~/.ruby-version" }}
          paths:
            - test/vendor
      - restore_cache:
          name: restore go lint cache
          keys:
            - einblick-go-lint-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-lint-version" }}-{{ checksum ".source-key" }}
            - einblick-go-lint-cache-o
      - run: make clean
      - run: make lint
      # - run: make proto-breaking
      - save_cache:
          name: save go lint cache
          key: einblick-go-lint-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-lint-version" }}-{{ checksum ".source-key" }}
          paths:
            - ~/.cache/golangci-lint
      - run: make sec
    resource_class: arm.large
  build-features:
    executor: go
    working_directory: ~/einblick
    steps:
      - prepare-service
      - run: make build-test
      - save_cache:
          name: save go build cache
          key: einblick-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
          paths:
            - ~/.cache/go-build
    resource_class: arm.large
  features:
    parameters:
      runtime:
        type: executor
        default: go
      partition:
        type: enum
        enum:
          - storage
          - archive-staging
          - archive-upload-transfer
          - archive-upload-recovery
          - archive-history-reads
          - archive-history-availability
          - queries
          - site
          - service
    executor: << parameters.runtime >>
    working_directory: ~/einblick
    steps:
      - prepare-service
      - run: make features-<< parameters.partition >>
      - when:
          condition:
            equal: [service, << parameters.partition >>]
          steps:
            - run: make benchmarks
            - run: make analyse
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=<< parameters.partition >>
      - persist_to_workspace:
          root: /tmp/einblick-reports
          paths:
            - << parameters.partition >>
    resource_class: arm.large
  coverage:
    executor: go
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/einblick-reports
      - run: make coverage-workspace-restore
      - run: make coverage
      - store_artifacts:
          path: test/reports
      - run: make codecov-upload
    resource_class: arm.large
  sync:
    executor: release
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - run: make sync push
    resource_class: arm.large
  version:
    executor: release
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - run: version
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - .
    resource_class: arm.large
  package:
    executor: release
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - run: make source-key
      - restore_cache:
          name: restore go cache
          keys:
            - einblick-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
            - einblick-go-cache-
      - restore_cache:
          name: restore go build cache
          keys:
            - einblick-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
            - einblick-go-build-cache-
      - run: package
    resource_class: arm.large
  wait-all:
    executor: alpine
    resource_class: small
    steps:
      - run: echo "all applicable jobs finished"
  test-docker-amd64:
    executor: go
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - setup_remote_docker:
          docker_layer_caching: true
      - run: make platform=amd64 test-docker
    resource_class: large
  test-docker-arm64:
    executor: go
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - setup_remote_docker:
          docker_layer_caching: true
      - run: make platform=arm64 test-docker
    resource_class: arm.large
  release-docker-amd64:
    executor: go
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make platform=amd64 release-docker
    resource_class: large
  release-docker-arm64:
    executor: go
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make platform=arm64 release-docker
    resource_class: arm.large
  manifest-docker:
    executor: go
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make manifest-docker
    resource_class: arm.large
  deploy:
    executor: release
    working_directory: ~/einblick
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - run: deploy
    resource_class: arm.large

workflows:
  einblick:
    jobs:
      - build-service
      - build-features
      - features:
          name: features-<< matrix.partition >>
          matrix:
            alias: feature-groups
            parameters:
              partition: [storage, archive-staging, queries, site, service]
          requires:
            - build-features
      - features:
          name: features-<< matrix.partition >>
          runtime: go-archive
          matrix:
            alias: archive-feature-groups
            parameters:
              partition:
                - archive-upload-transfer
                - archive-upload-recovery
                - archive-history-reads
                - archive-history-availability
          requires:
            - build-features
      - coverage:
          requires:
            - build-service
            - feature-groups
            - archive-feature-groups
      - test-docker-amd64:
          filters:
            branches:
              ignore: master
      - test-docker-arm64:
          filters:
            branches:
              ignore: master
      - sync:
          requires:
            - coverage
            - test-docker-amd64
            - test-docker-arm64
          filters:
            branches:
              ignore: master
      - version:
          context: gh
          serial-group: << pipeline.project.slug >>/version
          requires:
            - coverage
          filters:
            branches:
              only: master
      - package:
          context: gh
          serial-group: << pipeline.project.slug >>/package
          requires:
            - version
          filters:
            branches:
              only: master
      - release-docker-amd64:
          context: docker
          requires:
            - version
          filters:
            branches:
              only: master
      - release-docker-arm64:
          context: docker
          requires:
            - version
          filters:
            branches:
              only: master
      - manifest-docker:
          context: docker
          serial-group: << pipeline.project.slug >>/manifest-docker
          requires:
            - release-docker-amd64
            - release-docker-arm64
          filters:
            branches:
              only: master
      - deploy:
          context: gh
          requires:
            - manifest-docker
          filters:
            branches:
              only: master
      - wait-all:
          requires:
            - coverage
            - sync
            - test-docker-amd64
            - test-docker-arm64
            - version
            - package
            - release-docker-amd64
            - release-docker-arm64
            - manifest-docker
            - deploy
